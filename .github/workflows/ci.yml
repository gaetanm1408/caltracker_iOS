name: Build, tests et .ipa

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# Pas d'annulation des exécutions en cours : le .ipa est le livrable, et
# couper un build rendu obsolète par un push plus récent détruit l'artefact du
# commit intermédiaire. Les runners macOS sont gratuits sur un dépôt public.

jobs:
  build:
    name: Compilation, tests et empaquetage
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Environnement de build
        run: |
          xcodebuild -version
          swift --version

      - name: Choisir un simulateur iPhone
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '.devices
                | to_entries[]
                | select(.key | test("iOS"))
                | .value[]
                | select(.name | startswith("iPhone"))
                | .udid' \
            | head -1)
          if [ -z "$udid" ]; then
            echo "Aucun simulateur iPhone disponible sur ce runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Compiler et lancer les tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CalTracker.xcodeproj \
            -scheme CalTracker \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      # Le numéro d'exécution sert de numéro de build : il est unique, croissant,
      # et se retrouve tel quel dans Réglages une fois l'app installée. Savoir
      # quel paquet tourne sur le téléphone ne doit pas demander de deviner.
      - name: Numéroter le build
        id: version
        run: |
          version=$(grep -m1 'MARKETING_VERSION' CalTracker.xcodeproj/project.pbxproj \
            | sed 's/.*= *//; s/;//' | tr -d ' ')
          build="${{ github.run_number }}"
          sha=$(git rev-parse --short HEAD)
          name="CalTracker-${version}-b${build}-${sha}"
          {
            echo "version=$version"
            echo "build=$build"
            echo "sha=$sha"
            echo "name=$name"
            echo "ipa=${name}.ipa"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, build $build, commit $sha"

      # Build appareil sans signature : la signature est apposée sur le PC de
      # l'utilisateur (Sideloadly, AltStore) avec son propre identifiant Apple.
      - name: Construire l'app pour appareil, non signée
        run: |
          set -o pipefail
          xcodebuild build \
            -project CalTracker.xcodeproj \
            -scheme CalTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            | tee build-appareil.log

      - name: Empaqueter en .ipa
        run: |
          app="build/Build/Products/Release-iphoneos/CalTracker.app"
          if [ ! -d "$app" ]; then
            echo "Application introuvable à $app" >&2
            find build/Build/Products -maxdepth 2 -name '*.app' >&2 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$app" Payload/
          # Un .ipa n'est qu'une archive zip contenant un dossier Payload.
          zip -qry "${{ steps.version.outputs.ipa }}" Payload
          ls -lh "${{ steps.version.outputs.ipa }}"

      # AltStore lit l'Info.plist du paquet avant de signer ; une erreur de
      # décodage de sa part ne dit pas ce qui cloche, d'où cette inspection.
      - name: Inspecter le paquet
        run: |
          app="build/Build/Products/Release-iphoneos/CalTracker.app"
          echo "## Contenu du bundle"
          find "$app" -maxdepth 2 | sed "s|$app|CalTracker.app|"
          echo
          echo "## Info.plist"
          plutil -p "$app/Info.plist"
          echo
          echo "## Validation de l'Info.plist"
          plutil -lint "$app/Info.plist"
          echo
          echo "## Structure du .ipa"
          unzip -l "${{ steps.version.outputs.ipa }}" | head -40

      - name: Publier le .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: ${{ steps.version.outputs.ipa }}
          retention-days: 30

      - name: Résumer le paquet
        if: success()
        run: |
          recettes=$(python3 -c "import json;print(len(json.load(open('CalTracker/Resources/RecipeCatalogue.json'))['recipes']))")
          catalogue=$(python3 -c "import json;print(json.load(open('CalTracker/Resources/RecipeCatalogue.json'))['version'])")
          {
            echo "## CalTracker ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Paquet | \`${{ steps.version.outputs.ipa }}\` |"
            echo "| Affiché dans Réglages | ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}) |"
            echo "| Commit | \`${{ steps.version.outputs.sha }}\` |"
            echo "| Catalogue | version $catalogue, $recettes recettes |"
            echo "| Taille | $(du -h '${{ steps.version.outputs.ipa }}' | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Résumer les erreurs
        if: failure()
        run: |
          {
            echo '## Erreurs remontées par le compilateur'
            echo
            echo '```'
            grep -hE '(error|warning): ' xcodebuild.log build-appareil.log 2>/dev/null | sort -u | head -60 \
              || echo 'Aucune ligne error/warning : voir le journal complet en artefact.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver le journal et les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-build
          path: |
            xcodebuild.log
            build-appareil.log
            TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
